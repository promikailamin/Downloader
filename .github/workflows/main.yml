
name: SourceForge Issue Downloader

on:
    issues:
        types: [opened]

permissions:
    contents: read

jobs:
    download:
        runs-on: macos-latest
        timeout-minutes: 360

        steps:
            - name: Extract URL from issue body
              id: extract
              shell: bash
              env:
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: |
                  python3 - <<'PY'
                  import os
                  import re

                  body = os.environ.get("ISSUE_BODY", "")

                  match = re.search(
                      r'https?://[^\s<>"`]+',
                      body
                  )

                  if not match:
                      raise SystemExit("No URL found")

                  url = match.group(0).rstrip(".,;:!?)")

                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"url={url}\n")

                  print("URL extracted successfully")
                  PY

            - name: Install GNU Wget
              shell: bash
              run: |
                  if ! command -v wget >/dev/null 2>&1; then
                      brew install wget
                  fi

                  echo "Wget location:"
                  which wget

                  echo "Wget version:"
                  wget --version | head -n 2

            - name: Check runner network
              shell: bash
              run: |
                  echo "Runner information:"
                  sw_vers

                  echo "Network test:"
                  curl -L -s -o /dev/null \
                    -w "HTTP: %{http_code}\nSpeed: %{speed_download} bytes/sec\n" \
                    https://downloads.sourceforge.net/

            - name: Download SourceForge file
              shell: bash
              env:
                  DOWNLOAD_URL: ${{ steps.extract.outputs.url }}
              run: |
                  echo "Starting SourceForge download..."
                  echo "Runner: macOS"
                  echo "Downloader: GNU Wget"

                  wget \
                    --continue \
                    --output-document=release_file \
                    --tries=20 \
                    --waitretry=10 \
                    --retry-connrefused \
                    --timeout=60 \
                    --read-timeout=60 \
                    --max-redirect=20 \
                    --progress=bar:force:noscroll \
                    "$DOWNLOAD_URL"

            - name: Verify downloaded file
              shell: bash
              run: |
                  if [ ! -s release_file ]; then
                      echo "ERROR: Download failed or empty"
                      exit 1
                  fi

                  echo "Download completed!"

                  ls -lh release_file

                  echo "File size:"
                  stat -f "%z bytes" release_file

                  echo "SHA256:"
                  shasum -a 256 release_file

            - name: Upload GitHub Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sourceforge-file
                  path: release_file
                  compression-level: 0
                  if-no-files-found: error
                  retention-days: 3
