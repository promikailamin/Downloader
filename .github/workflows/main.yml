
name: SourceForge Issue Downloader

on:
    issues:
        types: [opened]

permissions:
    contents: read
    issues: write

jobs:
    download:
        runs-on: ubuntu-latest
        timeout-minutes: 360

        steps:
            - name: Extract URL from issue body
              id: extract
              env:
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: |
                  python3 - <<'PY'
                  import os
                  import re

                  body = os.environ.get("ISSUE_BODY", "")

                  match = re.search(
                      r'https?://[^\s<>"`]+',
                      body
                  )

                  if not match:
                      raise SystemExit("No URL found")

                  url = match.group(0).rstrip(".,;:!?)")

                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"url={url}\n")

                  print("URL extracted successfully")
                  PY

            - name: Download SourceForge file
              env:
                  DOWNLOAD_URL: ${{ steps.extract.outputs.url }}
              run: |
                  wget \
                    -O release_file \
                    --tries=20 \
                    --waitretry=10 \
                    --retry-connrefused \
                    --timeout=60 \
                    --read-timeout=60 \
                    --max-redirect=20 \
                    --progress=dot:giga \
                    "$DOWNLOAD_URL"

            - name: Verify download
              run: |
                  if [ ! -s release_file ]; then
                      echo "Download failed or empty file"
                      exit 1
                  fi

                  echo "Download completed!"
                  ls -lh release_file
                  sha256sum release_file

            - name: Upload GitHub Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sourceforge-file
                  path: release_file
                  compression-level: 0
                  if-no-files-found: error
                  retention-days: 3
